<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><circle cx='12' cy='12' r='8'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DrawDot — Minimal Whiteboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 select-none overflow-hidden">
    <div id="app" class="relative w-screen h-screen">

      <!-- Top Header -->
      <header class="fixed top-3 left-4 right-4 h-12 z-50 flex items-center justify-between px-3 rounded-xl border border-white/10 bg-zinc-900/80 backdrop-blur-md shadow-lg">
        <div class="flex items-center gap-2.5">
          <div class="flex items-center gap-2 pr-2 border-r border-white/10">
            <span class="w-3 h-3 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 animate-pulse-dot shadow-sm shadow-indigo-500/50"></span>
            <span class="font-bold text-sm tracking-tight text-white">DrawDot</span>
          </div>

          <input
            type="text"
            id="doc-title-input"
            class="bg-transparent border border-transparent hover:bg-white/5 focus:bg-zinc-800 focus:border-indigo-500 rounded px-2 py-1 text-xs font-medium text-zinc-300 focus:text-white transition outline-none w-36"
            value="Untitled Drawing"
            spellcheck="false"
          />

          <div class="flex items-center gap-1 pl-2 border-l border-white/10">
            <button id="btn-undo" class="p-1.5 rounded-lg text-zinc-400 hover:text-white hover:bg-white/10 disabled:opacity-30 disabled:pointer-events-none transition" title="Undo (Ctrl+Z)" disabled>
              <i data-lucide="undo-2" class="w-4 h-4"></i>
            </button>
            <button id="btn-redo" class="p-1.5 rounded-lg text-zinc-400 hover:text-white hover:bg-white/10 disabled:opacity-30 disabled:pointer-events-none transition" title="Redo (Ctrl+Y)" disabled>
              <i data-lucide="redo-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <!-- Snapping & Grid Options -->
          <div class="flex items-center gap-1">
            <button id="btn-toggle-guides" class="badge-btn active flex items-center gap-1.5 px-2.5 py-1 text-xs rounded-lg font-medium text-indigo-400 bg-indigo-500/15 border border-indigo-500/30 transition hover:bg-indigo-500/20" title="Toggle Smart Guides">
              <i data-lucide="magnet" class="w-3.5 h-3.5"></i>
              <span>Guides</span>
            </button>
            <button id="btn-toggle-grid-snap" class="badge-btn flex items-center gap-1.5 px-2.5 py-1 text-xs rounded-lg font-medium text-zinc-400 hover:text-white hover:bg-white/5 border border-transparent transition" title="Toggle Grid Snap">
              <i data-lucide="grid-3x3" class="w-3.5 h-3.5"></i>
              <span>Grid Snap</span>
            </button>
            <button id="btn-cycle-background" class="badge-btn flex items-center gap-1.5 px-2.5 py-1 text-xs rounded-lg font-medium text-indigo-400 bg-indigo-500/15 border border-indigo-500/30 transition hover:bg-indigo-500/20" title="Cycle Background">
              <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
              <span id="bg-pattern-label">Dots</span>
            </button>
          </div>

          <div class="h-4 w-px bg-white/10 mx-1"></div>

          <!-- Utility Icons -->
          <div class="flex items-center gap-1">
            <button id="btn-theme-toggle" class="p-1.5 rounded-lg text-zinc-400 hover:text-white hover:bg-white/10 transition" title="Toggle Theme">
              <i data-lucide="moon" id="theme-icon" class="w-4 h-4"></i>
            </button>
            <button id="btn-shortcuts" class="p-1.5 rounded-lg text-zinc-400 hover:text-white hover:bg-white/10 transition" title="Shortcuts (?)">
              <i data-lucide="keyboard" class="w-4 h-4"></i>
            </button>
            <button id="btn-clear-canvas" class="p-1.5 rounded-lg text-zinc-400 hover:text-red-400 hover:bg-red-500/10 transition" title="Clear Canvas">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="h-4 w-px bg-white/10 mx-1"></div>

          <!-- File & Export Buttons -->
          <div class="flex items-center gap-1.5">
            <button id="btn-import-json" class="h-8 px-2.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 text-zinc-200 bg-zinc-800 hover:bg-zinc-700 border border-white/10 transition">
              <i data-lucide="folder-open" class="w-3.5 h-3.5"></i>
              <span>Open</span>
            </button>
            <input type="file" id="file-input-json" accept=".json,.drawdot" class="hidden" />

            <div class="relative">
              <button id="btn-export-dropdown" class="h-8 px-3 rounded-lg text-xs font-semibold flex items-center gap-1.5 text-white bg-indigo-600 hover:bg-indigo-500 shadow-md shadow-indigo-600/30 transition">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span>Export</span>
                <i data-lucide="chevron-down" class="w-3 h-3 -mr-0.5"></i>
              </button>

              <div id="export-menu" class="hidden absolute top-full right-0 mt-2 w-56 rounded-xl border border-white/10 bg-zinc-900/95 backdrop-blur-md shadow-2xl p-1.5 flex flex-col gap-1 z-50">
                <button class="w-full flex items-center gap-2.5 p-2 rounded-lg text-left hover:bg-white/10 transition" id="export-png-btn">
                  <i data-lucide="image" class="w-4 h-4 text-indigo-400"></i>
                  <div>
                    <div class="text-xs font-medium text-white">Export PNG</div>
                    <div class="text-[10px] text-zinc-400">Cropped to content, 2x retina</div>
                  </div>
                </button>
                <button class="w-full flex items-center gap-2.5 p-2 rounded-lg text-left hover:bg-white/10 transition" id="export-png-trans-btn">
                  <i data-lucide="sparkles" class="w-4 h-4 text-indigo-400"></i>
                  <div>
                    <div class="text-xs font-medium text-white">PNG (Transparent)</div>
                    <div class="text-[10px] text-zinc-400">No background color</div>
                  </div>
                </button>
                <button class="w-full flex items-center gap-2.5 p-2 rounded-lg text-left hover:bg-white/10 transition" id="copy-clipboard-btn">
                  <i data-lucide="clipboard-copy" class="w-4 h-4 text-indigo-400"></i>
                  <div>
                    <div class="text-xs font-medium text-white">Copy to Clipboard</div>
                    <div class="text-[10px] text-zinc-400">Instant paste into apps</div>
                  </div>
                </button>
                <div class="h-px bg-white/10 my-0.5"></div>
                <button class="w-full flex items-center gap-2.5 p-2 rounded-lg text-left hover:bg-white/10 transition" id="export-json-btn">
                  <i data-lucide="file-code" class="w-4 h-4 text-indigo-400"></i>
                  <div>
                    <div class="text-xs font-medium text-white">Save .drawdot File</div>
                    <div class="text-[10px] text-zinc-400">Editable vector scene</div>
                  </div>
                </button>
                <button class="w-full flex items-center gap-2.5 p-2 rounded-lg text-left hover:bg-white/10 transition" id="export-svg-btn">
                  <i data-lucide="file-type-2" class="w-4 h-4 text-indigo-400"></i>
                  <div>
                    <div class="text-xs font-medium text-white">Export SVG</div>
                    <div class="text-[10px] text-zinc-400">Scalable vector graphics</div>
                  </div>
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Three Stacked Layers -->
      <main class="absolute inset-0 w-full h-full bg-[#121317]" id="canvas-viewport">
        <!-- Layer 1: Background Div (CSS repeating pattern) -->
        <div id="background-grid" class="canvas-layer canvas-layer-bg pattern-dots"></div>

        <!-- Layer 2: Fabric Canvas (Content Model) -->
        <div id="fabric-container" class="canvas-layer canvas-layer-content">
          <canvas id="fabric-canvas"></canvas>
        </div>

        <!-- Layer 3: Overlay Canvas (Laser + Smart Guides) -->
        <canvas id="overlay-canvas" class="canvas-layer canvas-layer-overlay"></canvas>
      </main>

      <!-- Floating Tool Dock -->
      <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50">
        <div class="flex items-center gap-1 p-1 rounded-full border border-white/10 bg-zinc-900/80 backdrop-blur-md shadow-2xl" id="floating-dock">
          <button class="tool-btn active relative w-9 h-9 rounded-full flex items-center justify-center text-zinc-400 hover:text-white transition" data-tool="select" title="Select (V)">
            <i data-lucide="mouse-pointer-2" class="w-4 h-4"></i>
            <span class="absolute bottom-0.5 right-1.5 text-[8px] font-mono opacity-50">V</span>
          </button>
          <button class="tool-btn relative w-9 h-9 rounded-full flex items-center justify-center text-zinc-400 hover:text-white transition" data-tool="hand" title="Hand / Pan (H)">
            <i data-lucide="hand" class="w-4 h-4"></i>
            <span class="absolute bottom-0.5 right-1.5 text-[8px] font-mono opacity-50">H</span>
          </button>

          <div class="w-px h-5 bg-white/10 mx-1"></div>

          <button class="tool-btn relative w-9 h-9 rounded-full flex items-center justify-center text-zinc-400 hover:text-white transition" data-tool="rectangle" title="Rectangle (R)">
            <i data-lucide="square" class="w-4 h-4"></i>
            <span class="absolute bottom-0.5 right-1.5 text-[8px] font-mono opacity-50">R</span>
          </button>
          <button class="tool-btn relative w-9 h-9 rounded-full flex items-center justify-center text-zinc-400 hover:text-white transition" data-tool="circle" title="Circle (O)">
            <i data-lucide="circle" class="w-4 h-4"></i>
            <span class="absolute bottom-0.5 right-1.5 text-[8px] font-mono opacity-50">O</span>
          </button>
          <button class="tool-btn relative w-9 h-9 rounded-full flex items-center justify-center text-zinc-400 hover:text-white transition" data-tool="arrow" title="Arrow (A)">
            <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
            <span class="absolute bottom-0.5 right-1.5 text-[8px] font-mono opacity-50">A</span>
          </button>
          <button class="tool-btn relative w-9 h-9 rounded-full flex items-center justify-center text-zinc-400 hover:text-white transition" data-tool="line" title="Line (L)">
            <i data-lucide="minus" class="w-4 h-4"></i>
            <span class="absolute bottom-0.5 right-1.5 text-[8px] font-mono opacity-50">L</span>
          </button>
          <button class="tool-btn relative w-9 h-9 rounded-full flex items-center justify-center text-zinc-400 hover:text-white transition" data-tool="pen" title="Pen (P)">
            <i data-lucide="pen-tool" class="w-4 h-4"></i>
            <span class="absolute bottom-0.5 right-1.5 text-[8px] font-mono opacity-50">P</span>
          </button>
          <button class="tool-btn relative w-9 h-9 rounded-full flex items-center justify-center text-zinc-400 hover:text-white transition" data-tool="text" title="Text (T)">
            <i data-lucide="type" class="w-4 h-4"></i>
            <span class="absolute bottom-0.5 right-1.5 text-[8px] font-mono opacity-50">T</span>
          </button>

          <div class="w-px h-5 bg-white/10 mx-1"></div>

          <button class="tool-btn relative w-9 h-9 rounded-full flex items-center justify-center text-zinc-400 hover:text-white transition" data-tool="eraser" title="Eraser (E)">
            <i data-lucide="eraser" class="w-4 h-4"></i>
            <span class="absolute bottom-0.5 right-1.5 text-[8px] font-mono opacity-50">E</span>
          </button>
          <button class="tool-btn relative w-9 h-9 rounded-full flex items-center justify-center text-zinc-400 hover:text-white transition" data-tool="laser" title="Laser Pointer (K)">
            <i data-lucide="flame" class="w-4 h-4"></i>
            <span class="absolute bottom-0.5 right-1.5 text-[8px] font-mono opacity-50">K</span>
          </button>
        </div>
      </nav>

      <!-- Contextual Property Panel -->
      <aside class="fixed top-18 left-4 w-60 max-h-[calc(100vh-120px)] z-40 flex flex-col rounded-xl border border-white/10 bg-zinc-900/85 backdrop-blur-md shadow-2xl overflow-hidden transition-all duration-200" id="context-panel">
        <div class="flex items-center justify-between px-3 py-2 border-b border-white/10">
          <span class="text-[11px] font-bold uppercase tracking-wider text-zinc-400" id="panel-title">Properties</span>
          <button id="btn-close-panel" class="text-zinc-400 hover:text-white p-1 rounded transition">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <div class="p-3 overflow-y-auto flex flex-col gap-3.5 max-h-[calc(100vh-170px)]">
          <!-- Stroke Color -->
          <div class="flex flex-col gap-1.5" id="prop-section-stroke">
            <div class="flex items-center justify-between text-[11px]">
              <label class="font-semibold text-zinc-300">Stroke Color</label>
              <span class="font-mono text-zinc-500" id="stroke-hex-val">#6366f1</span>
            </div>
            <div class="grid grid-cols-6 gap-1.5" id="stroke-palette"></div>
            <div class="flex items-center mt-1">
              <input type="color" id="custom-stroke-color" value="#6366f1" class="sr-only" />
              <label for="custom-stroke-color" class="w-full flex items-center justify-center gap-1.5 py-1 text-[11px] text-zinc-300 bg-white/5 hover:bg-white/10 border border-white/10 rounded-md cursor-pointer transition">
                <i data-lucide="pipette" class="w-3 h-3"></i>
                <span>Custom</span>
              </label>
            </div>
          </div>

          <!-- Fill Color -->
          <div class="flex flex-col gap-1.5" id="prop-section-fill">
            <div class="flex items-center justify-between text-[11px]">
              <label class="font-semibold text-zinc-300">Background / Fill</label>
              <span class="font-mono text-zinc-500" id="fill-hex-val">Transparent</span>
            </div>
            <div class="grid grid-cols-6 gap-1.5" id="fill-palette"></div>
            <div class="flex items-center mt-1">
              <input type="color" id="custom-fill-color" value="#ffffff" class="sr-only" />
              <label for="custom-fill-color" class="w-full flex items-center justify-center gap-1.5 py-1 text-[11px] text-zinc-300 bg-white/5 hover:bg-white/10 border border-white/10 rounded-md cursor-pointer transition">
                <i data-lucide="pipette" class="w-3 h-3"></i>
                <span>Custom</span>
              </label>
            </div>
          </div>

          <!-- Stroke Width -->
          <div class="flex flex-col gap-1.5" id="prop-section-width">
            <label class="text-[11px] font-semibold text-zinc-300">Stroke Width</label>
            <div class="flex p-0.5 rounded-lg bg-zinc-800 border border-white/10 gap-0.5" id="stroke-width-control">
              <button class="seg-btn flex-1 h-7 rounded flex items-center justify-center text-zinc-400 hover:text-white transition" data-width="2">
                <span class="w-4 h-0.5 bg-current rounded-full"></span>
              </button>
              <button class="seg-btn active flex-1 h-7 rounded flex items-center justify-center text-white bg-zinc-700 shadow-sm transition" data-width="4">
                <span class="w-4 h-1 bg-current rounded-full"></span>
              </button>
              <button class="seg-btn flex-1 h-7 rounded flex items-center justify-center text-zinc-400 hover:text-white transition" data-width="8">
                <span class="w-4 h-1.5 bg-current rounded-full"></span>
              </button>
              <button class="seg-btn flex-1 h-7 rounded flex items-center justify-center text-zinc-400 hover:text-white transition" data-width="14">
                <span class="w-4 h-2.5 bg-current rounded-full"></span>
              </button>
            </div>
          </div>

          <!-- Stroke Style -->
          <div class="flex flex-col gap-1.5" id="prop-section-style">
            <label class="text-[11px] font-semibold text-zinc-300">Stroke Style</label>
            <div class="flex p-0.5 rounded-lg bg-zinc-800 border border-white/10 gap-0.5 text-[11px]" id="stroke-style-control">
              <button class="seg-btn active flex-1 h-7 rounded flex items-center justify-center text-white bg-zinc-700 shadow-sm transition font-medium" data-style="solid">Solid</button>
              <button class="seg-btn flex-1 h-7 rounded flex items-center justify-center text-zinc-400 hover:text-white transition font-medium" data-style="dashed">Dashed</button>
              <button class="seg-btn flex-1 h-7 rounded flex items-center justify-center text-zinc-400 hover:text-white transition font-medium" data-style="dotted">Dotted</button>
            </div>
          </div>

          <!-- Laser Color -->
          <div class="flex flex-col gap-1.5" id="prop-section-laser" style="display: none;">
            <label class="text-[11px] font-semibold text-zinc-300">Laser Color</label>
            <div class="flex gap-2" id="laser-colors">
              <button class="laser-color-btn active w-7 h-7 rounded-full bg-red-500 shadow-md shadow-red-500/50 transition hover:scale-110" data-laser="#ef4444"></button>
              <button class="laser-color-btn w-7 h-7 rounded-full bg-cyan-500 shadow-md shadow-cyan-500/50 transition hover:scale-110" data-laser="#06b6d4"></button>
              <button class="laser-color-btn w-7 h-7 rounded-full bg-emerald-500 shadow-md shadow-emerald-500/50 transition hover:scale-110" data-laser="#10b981"></button>
              <button class="laser-color-btn w-7 h-7 rounded-full bg-amber-500 shadow-md shadow-amber-500/50 transition hover:scale-110" data-laser="#f59e0b"></button>
              <button class="laser-color-btn w-7 h-7 rounded-full bg-purple-500 shadow-md shadow-purple-500/50 transition hover:scale-110" data-laser="#a855f7"></button>
            </div>
          </div>

          <!-- Opacity -->
          <div class="flex flex-col gap-1.5" id="prop-section-opacity">
            <div class="flex items-center justify-between text-[11px]">
              <label class="font-semibold text-zinc-300">Opacity</label>
              <span class="font-mono text-zinc-500" id="opacity-val">100%</span>
            </div>
            <input type="range" id="opacity-slider" min="10" max="100" value="100" class="w-full accent-indigo-500 cursor-pointer" />
          </div>

          <!-- Corner Radius -->
          <div class="flex flex-col gap-1.5" id="prop-section-corners">
            <label class="text-[11px] font-semibold text-zinc-300">Corner Radius</label>
            <div class="flex p-0.5 rounded-lg bg-zinc-800 border border-white/10 gap-0.5 text-[11px]" id="corner-radius-control">
              <button class="seg-btn active flex-1 h-7 rounded flex items-center justify-center text-white bg-zinc-700 transition" data-radius="0">0</button>
              <button class="seg-btn flex-1 h-7 rounded flex items-center justify-center text-zinc-400 hover:text-white transition" data-radius="8">8px</button>
              <button class="seg-btn flex-1 h-7 rounded flex items-center justify-center text-zinc-400 hover:text-white transition" data-radius="16">16px</button>
            </div>
          </div>

          <!-- Text Size -->
          <div class="flex flex-col gap-1.5" id="prop-section-text">
            <label class="text-[11px] font-semibold text-zinc-300">Font Size</label>
            <div class="flex p-0.5 rounded-lg bg-zinc-800 border border-white/10 gap-0.5 text-[11px]" id="text-size-control">
              <button class="seg-btn flex-1 h-7 rounded flex items-center justify-center text-zinc-400 hover:text-white transition" data-size="16">S</button>
              <button class="seg-btn active flex-1 h-7 rounded flex items-center justify-center text-white bg-zinc-700 transition" data-size="24">M</button>
              <button class="seg-btn flex-1 h-7 rounded flex items-center justify-center text-zinc-400 hover:text-white transition" data-size="36">L</button>
              <button class="seg-btn flex-1 h-7 rounded flex items-center justify-center text-zinc-400 hover:text-white transition" data-size="48">XL</button>
            </div>
          </div>

          <!-- Actions -->
          <div class="flex flex-col gap-1.5" id="prop-section-actions">
            <label class="text-[11px] font-semibold text-zinc-300">Actions</label>
            <div class="grid grid-cols-2 gap-1.5">
              <button id="btn-duplicate" class="h-7 px-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 border border-white/10 transition text-zinc-300 hover:text-white">
                <i data-lucide="copy" class="w-3 h-3"></i>
                <span>Duplicate</span>
              </button>
              <button id="btn-delete" class="h-7 px-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1.5 bg-zinc-800 hover:bg-red-500/20 hover:border-red-500/40 border border-white/10 transition text-zinc-300 hover:text-red-400">
                <i data-lucide="trash" class="w-3 h-3"></i>
                <span>Delete</span>
              </button>
              <button id="btn-bring-forward" class="h-7 px-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 border border-white/10 transition text-zinc-300 hover:text-white">
                <i data-lucide="bring-to-front" class="w-3 h-3"></i>
                <span>Front</span>
              </button>
              <button id="btn-send-backward" class="h-7 px-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 border border-white/10 transition text-zinc-300 hover:text-white">
                <i data-lucide="send-to-back" class="w-3 h-3"></i>
                <span>Back</span>
              </button>
            </div>
          </div>
        </div>
      </aside>

      <!-- Bottom Bar -->
      <footer class="fixed bottom-4 left-4 right-4 flex items-center justify-between pointer-events-none z-40">
        <div class="pointer-events-auto px-2.5 py-1 rounded-lg border border-white/10 bg-zinc-900/80 backdrop-blur-md text-[11px] font-medium text-zinc-400" id="canvas-info-badge">
          <span id="canvas-items-count">0 items</span>
        </div>

        <div class="pointer-events-auto flex items-center gap-1 p-1 rounded-lg border border-white/10 bg-zinc-900/80 backdrop-blur-md">
          <button id="btn-zoom-out" class="p-1.5 rounded text-zinc-400 hover:text-white hover:bg-white/10 transition" title="Zoom Out (-)">
            <i data-lucide="minus" class="w-3.5 h-3.5"></i>
          </button>
          <button id="btn-zoom-reset" class="px-2 py-0.5 text-xs font-mono font-medium text-zinc-300 hover:text-white rounded transition" title="Reset Zoom">
            <span id="zoom-percentage">100%</span>
          </button>
          <button id="btn-zoom-in" class="p-1.5 rounded text-zinc-400 hover:text-white hover:bg-white/10 transition" title="Zoom In (+)">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          </button>
          <div class="w-px h-3.5 bg-white/10 mx-0.5"></div>
          <button id="btn-zoom-fit" class="p-1.5 rounded text-zinc-400 hover:text-white hover:bg-white/10 transition" title="Fit to Content (Shift+1)">
            <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </footer>

      <!-- Shortcuts Modal -->
      <div id="shortcuts-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="w-full max-w-md rounded-2xl border border-white/10 bg-zinc-900 shadow-2xl p-5">
          <div class="flex items-center justify-between pb-3 border-b border-white/10">
            <h3 class="font-bold text-sm text-white">Keyboard Shortcuts</h3>
            <button id="btn-close-shortcuts" class="text-zinc-400 hover:text-white p-1 rounded">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="grid grid-cols-2 gap-4 pt-3 text-xs">
            <div>
              <div class="font-bold text-indigo-400 uppercase text-[10px] mb-2">Tools</div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Select</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">V</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Hand / Pan</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">H</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Rectangle</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">R</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Circle</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">O</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Arrow</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">A</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Line</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">L</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Pen</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">P</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Text</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">T</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Eraser</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">E</kbd></div>
              <div class="flex justify-between py-1 text-zinc-300"><span>Laser</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">K</kbd></div>
            </div>
            <div>
              <div class="font-bold text-indigo-400 uppercase text-[10px] mb-2">Actions</div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Undo</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">Ctrl+Z</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Redo</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">Ctrl+Y</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Delete</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">Del</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Duplicate</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">Ctrl+D</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Select All</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">Ctrl+A</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Zoom</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">+/-</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Reset Zoom</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">Ctrl+0</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Fit Content</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">Shift+1</kbd></div>
              <div class="flex justify-between py-1 border-b border-white/5 text-zinc-300"><span>Front</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">]</kbd></div>
              <div class="flex justify-between py-1 text-zinc-300"><span>Back</span><kbd class="px-1.5 py-0.5 rounded bg-zinc-800 border border-white/10 text-[10px]">[</kbd></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Toast Container -->
      <div id="toast-container" class="fixed bottom-6 left-6 flex flex-col gap-2 z-50 pointer-events-none"></div>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
